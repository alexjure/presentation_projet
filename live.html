<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classement Live Animé</title>
    <link rel="stylesheet" href="stylelive.css">
</head>

<body>
    <div id="overlayStop"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; color:white; flex-direction:column; align-items:center; justify-content:center; text-align:center; font-family:sans-serif;">
        <h1>🏁 QUIZ TERMINÉ 🏁</h1>
        <p class="finishQuiz">Le classement final est gelé.</p>
        <p class="thanks">Merci à tous les agents de la mairie !</p>
    </div>
    <div style="text-align: center; margin-top: 20px;">
        <div id="statusBadge" style="display:inline-block; padding: 6px 18px; border-radius: 20px; font-weight: bold; font-size: 14px; text-transform: uppercase; font-family: sans-serif; letter-spacing: 1px;">
            Connexion...
        </div>
    </div>
    <h2 id="liveTitle">🏆 Classement Quiz 🏆</h2>
    <div id="lastUpdate">En attente de données...</div>

    <ul id="leaderboardList">
    </ul>

    <script src="scriptlive.js"></script>
</body>

</html>
